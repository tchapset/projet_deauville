[project]
name = "deauville"
version = "0.1.0"
description = "Programme management for the Deauville Festival du Rire."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.148.0",
    "sqlmodel>=0.0.48",
    "uvicorn>=0.54.0",
]

[project.scripts]
deauville = "deauville.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deauville"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
extend-exclude = ["b1"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
